<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1D2739"/>
      <stop offset="1" stop-color="#0E131D"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D9A4"/>
      <stop offset="0.45" stop-color="#B58B4C"/>
      <stop offset="1" stop-color="#7C5B2D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- clip behind -->
  <g transform="translate(330 300) rotate(-8 270 240)">
    <rect x="36" y="228" width="468" height="44" rx="22" fill="url(#metal)"/>
    <rect x="56" y="240" width="428" height="10" rx="5" fill="#FFEDC2" opacity="0.55"/>
    <rect x="56" y="202" width="38" height="96" rx="19" fill="#8A6637"/>
    <rect x="446" y="202" width="38" height="96" rx="19" fill="#8A6637"/>
  </g>

  <!-- enamel pin -->
  <g transform="translate(300 250) rotate(-8 270 240)" filter="url(#shadow)">
    <rect width="540" height="480" rx="98" fill="#F3EBDD"/>
    <rect x="12" y="12" width="516" height="456" rx="88" fill="none" stroke="#1F2A44" stroke-opacity="0.16" stroke-width="3"/>
    <g transform="translate(108 72) scale(3.12)">
      <rect x="10" y="10" width="18" height="80" fill="#1F2A44"/>
      <rect x="72" y="10" width="18" height="80" fill="#1F2A44"/>
      <polygon points="28,10 28,38 72,90 72,62" fill="#1F2A44"/>
      <path d="M19 18 V82 M81 18 V82 M19 50 H81" fill="none" stroke="#D98A5F" stroke-width="7" stroke-linecap="butt"/>
    </g>
    <circle cx="462" cy="400" r="11" fill="#D98A5F"/>
  </g>

  <!-- small shine -->
  <path d="M380 300 C430 280 500 278 550 292" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.28"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text x="70" y="1090" fill="#F3EBDD" font-size="26" font-weight="700">Nihonco · 徽章发夹</text>
    <text x="70" y="1124" fill="#8E9AB0" font-size="16">约 3 cm / 米白烤漆 + 藏青 N + 暖橙细 H</text>
  </g>
</svg>
